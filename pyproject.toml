[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend="setuptools.build_meta"

[project]
name = "qwip"
version = "24.10.0"
authors = [
    {name = "Larry Chen", email = "larrychen@berkeley.edu"},
]
description = "Quantum Workflows in Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "attrs>=24.2.0",
    "cattrs>=24.1.0",
    "httpx",
    "ipython",
    "lbl-qubic",
    "loguru>=0.7.2,<0.8",
    "lmfit",
    "matplotlib",
    "mysqlclient",
    "notifiers",
    "numpy",
    "pandas",
    "pendulum>=3.0",
    "plotly",
    "pyarrow",
    "python-multipart",
    "qutip",
    "rich",
    "rustworkx",
    "scikit-learn",
    "scipy",
    "sqlalchemy",
    "sympy>=1.13",
    "tomli",
    "uuid6",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "fastapi",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-git-authors-plugin",
    "pydantic-settings",
    "pytest",
    "qcodes",
    "ruff",
    "typer"
]

server = [
    "fastapi",
    "gunicorn",
    "httpx",
    "pydantic-settings",
    "respx",
    "uvicorn[standard]"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["qwip*"]
namespaces = false

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"

markers = [
    "skip_instrument: Skip instrument tests if they are not available.",
    "skip_dataserver: Skip dataserver tests on live datasever."
]
filterwarnings = [
    "ignore:.*pkg_resources.*:DeprecationWarning"
]

[tool.isort]
profile = "black"
skip_gitignore = true
py_version = 312
