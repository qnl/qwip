site_name: QWiP
site_url: https://qnl.github.io/QWiP
repo_name: qnl/QWiP
repo_url: https://github.com/qnl/QWiP
docs_dir: pages
markdown_extensions:
  - admonition
  - codehilite:
      linenums: true
  - footnotes
  - pymdownx.arithmatex
  - pymdownx.caret
  - pymdownx.magiclink
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tilde
  - toc:
      permalink: true
theme:
  name: material
  font:
    text: Roboto
    code: Fira Code, Inconsolata
  palette:
    - scheme: berkeley-light
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  icon:
    logo: material/home
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
watch:
  - ../src/qwip
plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
  - git-authors
  - git-revision-date-localized:
      type: date
extra_css: 
  - assets/stylesheets/palette.css
  - assets/stylesheets/layout.css
extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-MML-AM_CHTML
nav:
  - QWiP: 
    - index.md
  - User Guide:
    - user-guide/intro.md
    - Configuration Management:
      - user-guide/configuration/configuration.md
    - Sequencer:
      - user-guide/sequences/sequencer.md
      - user-guide/sequences/sequence-elements.md
      - user-guide/sequences/sequences.md
  - Developer Guide: 
    - developer-guide/intro.md
    - developer-guide/roadmap.md
    - Guidelines:
      - developer-guide/guidelines/all-things-git.md
      - developer-guide/guidelines/coding-guidelines.md
      - developer-guide/guidelines/testing.md
      - developer-guide/guidelines/documentation.md
    - developer-guide/attrs.md

  - API Reference:
    - api/qwip.md
  - Changelog: CHANGELOG.md