site_name: QWiP
site_url: https://qnl-internal.berkeley.edu/QWiP
site_dir: site/QWiP
repo_name: qnl/QWiP
repo_url: https://github.com/qnl/QWiP
docs_dir: pages
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - footnotes
  - pymdownx.arithmatex
  - pymdownx.caret
  - pymdownx.magiclink
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
theme:
  name: material
  custom_dir: ./overrides
  font:
    text: Roboto
    code: Fira Code, Inconsolata
  palette:
    - scheme: berkeley-light
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  icon:
    logo: material/home
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.tabs
    - navigation.indexes
watch:
  - ../src/qwip
plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            paths: ../src/qwip
            show_source: true
          import:
            - https://docs.python.org/3/objects.inv
  - git-authors:
      enabled: true
  - git-revision-date-localized:
      type: date
extra_css:
  - assets/stylesheets/palette.css
  - assets/stylesheets/layout.css
  - assets/stylesheets/termynal.css
extra_javascript:
  - assets/js/termynal.js
  - assets/js/setup.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-MML-AM_CHTML
nav:
  - QWiP:
      - index.md
  - User Guide:
      - user-guide/index.md
      - Configuration Management:
          - user-guide/configuration/configuration.md
          - user-guide/configuration/first-steps.md
      - Sequencer:
          - user-guide/sequences/sequencer.md
          - user-guide/sequences/sequence-elements.md
          - user-guide/sequences/sequences.md
      - user-guide/workflow.md
  - Developer Guide:
      - developer-guide/index.md
      - developer-guide/roadmap.md
      - Guidelines:
          - developer-guide/guidelines/all-things-git.md
          - developer-guide/guidelines/coding-guidelines.md
          - developer-guide/guidelines/testing.md
          - developer-guide/guidelines/documentation.md
      - developer-guide/attrs.md
  - API Reference:
      - qwip:
          - qwip: api/qwip/index.md
          - qwip.defaults: api/qwip/defaults.md
          - qwip.flatdict: api/qwip/flatdict.md
          - qwip.testing: api/qwip/testing.md
          - qwip.typing: api/qwip/typing.md
          - qwip.utils: api/qwip/utils.md
      - qwip.analysis:
          - qwip.analysis: api/qwip/analysis/index.md
          - qwip.analysis.fitting: api/qwip/analysis/fitting.md
          - qwip.analysis.frequency: api/qwip/analysis/frequency.md
      - qwip.calibration:
          - qwip.calibration: api/qwip/calibration/index.md
          - qwip.calibration.calibration: api/qwip/calibration/calibration.md
          - qwip.calibration.readout: api/qwip/calibration/readout.md
      - qwip.config:
          - qwip.config: api/qwip/config/index.md
          - qwip.config.database: api/qwip/config/database.md
          - qwip.config.dolt: api/qwip/config/dolt.md
          - qwip.config.metadata: api/qwip/config/metadata.md
          - qwip.config.models: api/qwip/config/models.md
          - qwip.config.schema: api/qwip/config/schema.md
          - qwip.config.static: api/qwip/config/static.md
      - qwip.data:
          - qwip.data: api/qwip/data/index.md
          - qwip.data.filesystem: api/qwip/data/filesystem.md
      - qwip.instruments:
          - qwip.instruments: api/qwip/instruments/index.md
          - qwip.instruments.instrument_server: api/qwip/instruments/instrument_server.md
      - qwip.processing:
          - qwip.processing: api/qwip/processing/index.md
          - qwip.processing.data_processor: api/qwip/processing/data_processor.md
          - qwip.processing.processors: api/qwip/processing/processors.md
      - qwip.protocols:
          - qwip.protocols: api/qwip/protocols/index.md
