[metadata]
name = qwip
version = 0.1.0
author = Larry Chen
author_email = larrychen@berkeley.edu
description = Quantum Workflows in Python
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir = 
    = src
packages = find:
install_requires = 
    attrs
    cattrs
    numpy
    pendulum
    loguru
    pytest
python_requires = >= 3.10

[options.packages.find]
where = src